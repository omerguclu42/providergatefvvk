name: Firebase'e yayınla

# main dalına her gönderimde siteyi ve Firestore kurallarını yayınlar.
# Actions sekmesinden elle de çalıştırılabilir.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Derle
        run: npm run build

      - name: Firebase kimlik bilgisini hazırla
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret'ı tanımlı değil (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Hosting ve Firestore kurallarını yayınla
        run: npx --yes firebase-tools@latest deploy --only hosting,firestore:rules --project providergatefvvk --non-interactive

      - name: Kimlik bilgisini sil
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
